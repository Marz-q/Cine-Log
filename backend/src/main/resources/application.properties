server.port=8080

# Application info
spring.application.name=movie-social-backend

# Database configuration
# Sensible development defaults with environment variable overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinelog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
app.jwt.secret=${JWT_SECRET:CineLogSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256Security1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# TMDB API
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
